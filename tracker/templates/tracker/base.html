{% load static %}<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Finali{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'home' %}">FINALI</a>
    <nav>
      <a href="{% url 'home' %}">Diretta</a>
      <a href="{% url 'match_list' %}">Storico</a>
      {% if user.is_staff %}
        <a href="{% url 'match_create' %}">+ Nuova gara</a>
        <form method="post" action="{% url 'logout' %}" class="inline">
          {% csrf_token %}<button type="submit" class="link">Esci</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Admin</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% for m in messages %}<div class="flash {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
